<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" width="660" height="490">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="660" height="490" fill="#ffffff"/>

  <g font-family="Times New Roman, Times, serif" fill="#000000">

    <!-- root -->
    <rect x="10" y="203" width="160" height="66" fill="none" stroke="#000000" stroke-width="1"/>
    <g font-size="13" text-anchor="middle">
      <text x="90" y="226">Where does the</text>
      <text x="90" y="244">detection signal</text>
      <text x="90" y="262">come from?</text>
    </g>

    <!-- spine -->
    <line x1="170" y1="236" x2="196" y2="236" stroke="#000000" stroke-width="1"/>
    <line x1="196" y1="44" x2="196" y2="428" stroke="#000000" stroke-width="1"/>
    <line x1="196" y1="44" x2="226" y2="44" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="196" y1="140" x2="226" y2="140" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="196" y1="236" x2="226" y2="236" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="196" y1="332" x2="226" y2="332" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="196" y1="428" x2="226" y2="428" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 3.1 -->
    <rect x="230" y="30" width="300" height="28" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="240" y="49" font-size="13">3.1 Handcrafted / frequency-domain forensics</text>
    <g font-size="11">
      <text x="246" y="74">spectral profiles and DCT artefacts</text>
      <text x="246" y="88">high-pass filtered inputs</text>
      <text x="246" y="102">learned and handcrafted fingerprints</text>
    </g>

    <!-- 3.2 -->
    <rect x="230" y="126" width="300" height="28" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="240" y="145" font-size="13">3.2 CNN-based approaches + transfer learning</text>
    <g font-size="11">
      <text x="246" y="170">ImageNet-pretrained backbones</text>
      <text x="246" y="184">derived inputs: gradients, pixel relationships</text>
      <text x="246" y="198">reconstruction error</text>
      <text x="246" y="212">contrastive training, training-set diversity</text>
    </g>

    <!-- 3.3 -->
    <rect x="230" y="222" width="300" height="28" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="240" y="241" font-size="13">3.3 Transformer / attention-based approaches</text>
    <g font-size="11">
      <text x="246" y="266">vision transformer trained or fine-tuned</text>
      <text x="246" y="280">forgery-aware adapter on a frozen CLIP ViT</text>
    </g>

    <!-- 3.4 -->
    <rect x="230" y="318" width="300" height="28" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="240" y="337" font-size="13">3.4 Frozen vision-language (CLIP) features</text>
    <g font-size="11">
      <text x="246" y="362">nearest-neighbour rules and linear probes</text>
      <text x="246" y="376">prompt tuning and prompt injection</text>
      <text x="246" y="390">orthogonal subspace decomposition</text>
    </g>

    <!-- 3.5 -->
    <rect x="230" y="414" width="300" height="28" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="240" y="433" font-size="13">3.5 Explainability-oriented work</text>
    <g font-size="11">
      <text x="246" y="458">Grad-CAM saliency maps</text>
      <text x="246" y="472">patch-level detectability maps, prototypes</text>
    </g>

  </g>
</svg>
