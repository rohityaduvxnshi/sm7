<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">

  <rect x="0" y="0" width="520" height="420" fill="#ffffff"/>

  <g font-family="Times New Roman, Times, serif" fill="#000000">

    <!-- title -->
    <text x="260" y="26" font-size="14" text-anchor="middle">Confusion matrix (positive class: AI-generated image)</text>

    <!-- column headers -->
    <text x="245" y="62" font-size="12" text-anchor="middle">Predicted: generated</text>
    <text x="395" y="62" font-size="12" text-anchor="middle">Predicted: real</text>

    <!-- row labels -->
    <text x="163" y="105" font-size="12" text-anchor="end">Actual: generated</text>
    <text x="163" y="165" font-size="12" text-anchor="end">Actual: real</text>

    <!-- grid -->
    <rect x="170" y="70" width="300" height="120" fill="none" stroke="#000000" stroke-width="1"/>
    <line x1="320" y1="70" x2="320" y2="190" stroke="#000000" stroke-width="1"/>
    <line x1="170" y1="130" x2="470" y2="130" stroke="#000000" stroke-width="1"/>

    <!-- cells -->
    <text x="245" y="102" font-size="18" text-anchor="middle">TP</text>
    <text x="245" y="120" font-size="10" text-anchor="middle">true positive</text>
    <text x="395" y="102" font-size="18" text-anchor="middle">FN</text>
    <text x="395" y="120" font-size="10" text-anchor="middle">false negative</text>
    <text x="245" y="162" font-size="18" text-anchor="middle">FP</text>
    <text x="245" y="180" font-size="10" text-anchor="middle">false positive</text>
    <text x="395" y="162" font-size="18" text-anchor="middle">TN</text>
    <text x="395" y="180" font-size="10" text-anchor="middle">true negative</text>

    <!-- formulas -->
    <text x="40" y="228" font-size="13">Metrics derived from the four counts</text>
    <line x1="40" y1="236" x2="480" y2="236" stroke="#000000" stroke-width="1"/>

    <text x="40" y="264" font-size="14">Accuracy = (TP + TN) / (TP + FP + FN + TN)</text>
    <text x="40" y="294" font-size="14">Precision = TP / (TP + FP)</text>
    <text x="40" y="324" font-size="14">Recall = TP / (TP + FN)</text>
    <text x="40" y="354" font-size="14">F1 = 2 &#183; (Precision &#183; Recall) / (Precision + Recall)</text>

    <!-- note -->
    <text x="40" y="390" font-size="11" font-style="italic">AUC (area under the ROC curve) and AP (average precision) summarise</text>
    <text x="40" y="406" font-size="11" font-style="italic">performance over a sweep of decision thresholds, not at one fixed point.</text>

  </g>
</svg>
