# vit_base_patch16_224, feature extraction — matrix run 9. MATRIX STATE ONLY: smoke_subset stays null.
# Values from implementation_plan.md Table 3. Field documentation: template.yaml.

model: vit_base_patch16_224
mode: fe                     # backbone frozen, only the new 2-class head trains
seed: 42

data:
  root: data/cifake
  split_file: data/cifake_split_seed42.csv
  num_workers: 2             # [VERIFY at first Kaggle login]

resolution: 224              # ImageNet-pretrained weights expect 224x224
batch_size: 64               # VGG19 and ViT need the smaller batch for T4 memory
augment: hflip               # horizontal flip only; anything stronger is an ablation, not the baseline

optimizer: adamw
lr: 0.001                   # head only, higher rate is safe; AdamW is the standard ViT optimiser
weight_decay: 0.0

max_epochs: 30
early_stopping_patience: 5
amp: true
checkpoint: best_val_loss

output:
  results_dir: results       # on Kaggle: /kaggle/working/results
  runs_csv: results/runs.csv

smoke_subset: null           # never non-null in a matrix config; smoke runs live in *_smoke.yaml
