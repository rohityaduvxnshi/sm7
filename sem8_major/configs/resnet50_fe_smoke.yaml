# SMOKE RUN ONLY — proves data -> train -> eval -> CSV append -> Grad-CAM end to end on a
# small subset, first on the laptop CPU, then once on a Kaggle GPU. Its rows go to
# results/smoke_runs.csv, NEVER results/runs.csv (train.py refuses runs.csv when
# smoke_subset is non-null). Field documentation: template.yaml.

model: resnet50
mode: fe
seed: 42

data:
  root: data/cifake
  split_file: data/cifake_split_seed42.csv
  num_workers: 2

resolution: 224
batch_size: 32               # small enough for the laptop CPU; the GPU smoke can override via CLI if needed
augment: hflip

optimizer: sgd
lr: 0.01
momentum: 0.9
weight_decay: 0.0

max_epochs: 2                # two epochs prove the loop, learning-curve rows and early-stop plumbing
early_stopping_patience: 5
amp: false                   # CPU has no AMP benefit; the Kaggle GPU smoke flips this to check the AMP path
checkpoint: best_val_loss

output:
  results_dir: results
  runs_csv: results/smoke_runs.csv

smoke_subset: 200            # images per class per split (stratified, first-N of the sorted split file):
                             # 400 train / 400 val / 400 test images total
