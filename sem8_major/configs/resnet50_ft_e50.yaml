# resnet50_ft, SESSION 7 RERUN at a 50-epoch ceiling. Identical to configs/resnet50_ft.yaml in
# every respect except max_epochs (30 -> 50). The original run stopped at the 30-epoch
# ceiling with validation loss still improving, making its result a lower bound rather
# than a converged one (see implementation_plan.md 7a session-5 note and 10).
# Only the epoch BUDGET changes -- no hyperparameter differs -- so this rerun remains
# directly comparable to the rest of the matrix. Early stopping (patience 5) is
# unchanged and is expected to end the run before epoch 50.

model: resnet50
mode: ft                     # every parameter updated
seed: 42

data:
  root: data/cifake
  split_file: data/cifake_split_seed42.csv
  num_workers: 2             # [VERIFY at first Kaggle login]

resolution: 224              # ImageNet-pretrained weights expect 224x224
batch_size: 128              # fits a T4 for the lighter backbones
augment: hflip               # horizontal flip only; anything stronger is an ablation, not the baseline

optimizer: sgd
lr: 0.001                   # pretrained weights need small updates or the features are destroyed
momentum: 0.9
weight_decay: 0.0

max_epochs: 50
early_stopping_patience: 5
amp: true
checkpoint: best_val_loss

output:
  results_dir: results       # on Kaggle: /kaggle/working/results
  runs_csv: results/runs.csv

smoke_subset: null           # never non-null in a matrix config; smoke runs live in *_smoke.yaml
