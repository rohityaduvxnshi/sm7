# resnet50_ft, A5 ABLATION: input resolution 64 px. Identical to the canonical baseline
# configs/resnet50_ft_e50.yaml (the 50-epoch resnet50_ft row in results/canonical_runs.txt)
# in every respect except `resolution: 64` (baseline: 224) and the `tag` that marks the run
# id. CIFAKE images are natively 32x32, so this tests how much of the baseline's accuracy
# depends on the 32->224 upscaling the ImageNet-pretrained backbone expects
# (implementation_plan.md 4 "Ablations", 7a A5). ResNet50 pools globally, so any input size
# works without code changes. Table t6_ablations is generated from the config difference.

model: resnet50
mode: ft                     # every parameter updated
seed: 42
tag: res64                   # run_id becomes resnet50_ft_res64_<stamp>

data:
  root: data/cifake
  split_file: data/cifake_split_seed42.csv
  num_workers: 2             # 2 on the 4-core Kaggle VM; used unchanged by all 13 logged runs

resolution: 64               # ABLATED: 32x32 source upscaled 2x instead of 7x
batch_size: 128              # fits a T4 for the lighter backbones
augment: hflip               # horizontal flip only; anything stronger is an ablation, not the baseline

optimizer: sgd
lr: 0.001                   # pretrained weights need small updates or the features are destroyed
momentum: 0.9
weight_decay: 0.0

max_epochs: 50               # same ceiling as the canonical baseline row
early_stopping_patience: 5
amp: true
checkpoint: best_val_loss

output:
  results_dir: results       # on Kaggle: /kaggle/working/results
  runs_csv: results/runs.csv

smoke_subset: null           # never non-null in a matrix/ablation config; smoke runs live in *_smoke.yaml
